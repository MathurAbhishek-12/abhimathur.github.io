.cell-lbl{font:500 10.5px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.rec .who{font-style:normal;font-size:14px;color:var(--muted)}

mark.ph{background:var(--signal-bg);color:var(--ink);border-bottom:1.5px dashed var(--signal);padding:0 2px;border-radius:2px}

  journal:{when:'[Week #]',title:'[Entry title]',place:'Internship journal',note:'[What happened, what you learned, what is next]'}
};
function get(p){return p.split('.').reduce(function(o,k){return o==null?o:o[k];},S);}
function set(p,v){var ks=p.split('.'),last=ks.pop(),o=ks.reduce(function(o,k){return o[k];},S);o[last]=v;}
function h(tag,cls,kids){var e=document.createElement(tag);if(cls)e.className=cls;(kids||[]).forEach(function(k){if(k!=null)e.append(k);});return e;}
function fillPH(e,v){var i=0;v.replace(PH,function(m,off){if(off>i)e.append(v.slice(i,off));var mk=h('mark','ph');mk.textContent=m;e.append(mk);i=off+m.length;return m;});if(i<v.length)e.append(v.slice(i));}
function txt(tag,cls,path,opt){var v=get(path)||'';var e=h(tag,cls);
  if(editing){e.textContent=v;e.contentEditable='true';e.dataset.path=path;e.classList.add('ed');}
  else{if(!v&&opt)return null;fillPH(e,v);}
  return e;}
function list(path,cls,item,tpl,addLabel){
  var arr=get(path)||[];var box=h('div',cls);
  arr.forEach(function(_,i){var it=item(path+'.'+i);
    if(editing){var rm=h('button','rm');rm.type='button';rm.textContent='Remove';
      rm.onclick=function(){arr.splice(i,1);dirty=true;render();};
      var w=h('div','item-wrap',[it,rm]);box.append(w);} else box.append(it);});
  if(!editing)return box;
  var add=h('button','add');add.type='button';add.textContent='+ '+addLabel;
  add.onclick=function(){arr.push(JSON.parse(JSON.stringify(tpl)));dirty=true;render();};
  return h('div','listwrap',[box,add]);}
function entry(p){var body=h('div','entry-body',[txt('h4','',p+'.title'),txt('p','place',p+'.place',true),txt('p','note',p+'.note',true)]);var lk=get(p+'.link');
  if(lk!==undefined){if(editing){body.append(h('p','linkrow',[lbl('Link'),txt('span','',p+'.link')]));}
    else if(/^https?:\/\//.test(lk)){var a=h('a','more');a.href=lk;a.target='_blank';a.rel='noopener';a.textContent='View project';body.append(a);}
    else if(lk){body.append(txt('p','note',p+'.link'));}}
  return h('article','entry',[txt('p','when',p+'.when'),body]);}
function contactVal(p){var v=get(p+'.value')||'';if(!editing&&/^https?:\/\//.test(v)){var a=h('a','val');a.href=v;a.target='_blank';a.rel='noopener';a.textContent=v.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'');return a;}return txt('span','val',p+'.value');}
function section(id,title,kids,meta){var h2=h('h2','',[title]);if(meta){var sm=h('small');sm.textContent=meta;h2.append(sm);}var s=h('section','',[h2].concat(kids));s.id=id;return s;}
function sub(t){var p=h('p','sub');p.textContent=t;return p;}
function lbl(t){var s=h('span','cell-lbl');s.textContent=t;return s;}

function render(){
  var y=window.scrollY;root.textContent='';
  var nav=h('ul','route');
  SECTIONS.forEach(function(s){var a=h('a');a.href='#'+s[0];a.textContent=s[1];a.dataset.sec=s[0];nav.append(h('li','',[a]));});
  var side=h('aside','side',[
    txt('p','kicker','profile.kicker'),
    txt('h1','','profile.name'),
    h('div','',[txt('p','role','profile.role'),txt('p','org','profile.org')]),
    list('profile.contacts','contacts',function(p){return h('div','contact',[txt('span','lbl',p+'.label'),contactVal(p)]);},TPL.contact,'Add contact'),
    h('nav','',[nav])
  ]);
  var cases=get('cases')||[];
  var main=h('main','',[
    section('about','About',[txt('p','lead','about.headline'),txt('p','prose','about.intro'),txt('p','prose','about.goals')]),
    section('credentials','Credentials',[
      sub('Education'),list('education','entries',entry,TPL.entry,'Add education'),
      sub('Experience'),list('experience','entries',entry,TPL.entry,'Add role'),
      sub('Certifications and training'),list('certs','entries',entry,TPL.entry,'Add certification')]),
    section('skills','Skills and evidence',[
      h('div','',[ (function(){var hd=h('div','skills-head');var a=h('span');a.textContent='Skill';var b=h('span');b.textContent='Evidence';hd.append(a,b);return hd;})() ]),
      list('skills','skills',function(p){return h('div','skill',[txt('p','s',p+'.skill'),txt('p','e',p+'.evidence')]);},TPL.skill,'Add skill')]),
    section('cases','Case studies',[list('cases','cases',function(p){
      return h('article','case',[h('header','case-head',[txt('p','tag',p+'.tag'),txt('h3','',p+'.title')]),
        h('div','case-grid',[['problem','Problem'],['approach','Approach'],['result','Result'],['lesson','Lesson learned']].map(function(k){return h('div','cell '+k[0],[lbl(k[1]),txt('p','',p+'.'+k[0])]);}))]);
    },TPL.case,'Add case study')],cases.length+(cases.length===1?' project':' projects')),
    section('projects','Data projects',[list('projects','entries',entry,TPL.project,'Add project')]),
    section('research','Research',[list('research','entries',entry,TPL.entry,'Add research item')]),
    section('leadership','Leadership and collaboration',[list('leadership','entries',entry,TPL.entry,'Add highlight')]),
    section('recs','Recommendations',[list('recs','recs',function(p){return h('blockquote','rec',[txt('p','',p+'.quote'),txt('span','who',p+'.who')]);},TPL.rec,'Add recommendation')]),
    section('journal','Journal',[list('journal','entries',entry,TPL.journal,'Add journal entry')]),
    (function(){var f=h('footer');f.textContent='Working portfolio · last updated '+(S.updated||'');return f;})()
  ]);
  // fix skills header placement: move into the skills list box
  var skillsBox=main.querySelector('#skills .skills');var head=main.querySelector('#skills .skills-head');
  if(skillsBox&&head){head.parentNode.remove();skillsBox.prepend(head);}
  root.append(h('div','wrap',[side,main]));
  window.scrollTo(0,y);
  watchNav();updateBar();
}

var io=null;
function watchNav(){if(io)io.disconnect();if(!('IntersectionObserver' in window))return;
  io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){
    root.querySelectorAll('.route a').forEach(function(a){a.classList.toggle('on',a.dataset.sec===e.target.id);});}});},{rootMargin:'-20% 0px -70% 0px'});
  root.querySelectorAll('main section').forEach(function(s){io.observe(s);});}

root.addEventListener('input',function(ev){var t=ev.target.closest('[data-path]');if(!t)return;
  set(t.dataset.path,t.innerText.replace(/ /g,' ').replace(/\n{3,}/g,'\n\n').trim());dirty=true;updateBar();});
root.addEventListener('paste',function(ev){var t=ev.target.closest&&ev.target.closest('[data-path]');if(!t)return;
  ev.preventDefault();var s=(ev.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,s);});

// toolbar
var bar=h('div','bar');bar.hidden=true;document.body.append(bar);
function btn(label,cls,fn){var b=h('button','btn '+(cls||''));b.type='button';b.textContent=label;b.onclick=fn;return b;}
var statusMsg='';
function countPH(){var n=0;(function walk(o){if(typeof o==='string'){var m=o.match(PH);if(m)n+=m.length;}else if(o&&typeof o==='object'){Object.keys(o).forEach(function(k){walk(o[k]);});}})(S);return n;}
function updateBar(){if(!canEdit)return;bar.hidden=false;bar.textContent='';
  var n=countPH();
  if(n>0)bar.append(btn(n+(n===1?' gap':' gaps')+' to fill','count',jumpPH));
  if(!editing){bar.append(btn('Edit page','primary',function(){editing=true;statusMsg='Click any text to change it.';render();}));}
  else{var sv=btn(saving?'Saving…':'Save changes','primary',save);sv.disabled=saving||!dirty;bar.append(btn('Cancel','',cancel),sv);}
  if(statusMsg){var s=h('span','status');s.textContent=statusMsg;bar.append(s);}
}
function jumpPH(){var marks=editing?Array.prototype.filter.call(root.querySelectorAll('[data-path]'),function(e){PH.lastIndex=0;return PH.test(e.textContent);}):root.querySelectorAll('mark.ph');
  if(!marks.length)return;phIndex=phIndex%marks.length;var m=marks[phIndex++];
  root.querySelectorAll('.hit').forEach(function(x){x.classList.remove('hit');});
  m.scrollIntoView({block:'center'});if(editing)m.focus();else m.classList.add('hit');}
function cancel(){var o=JSON.parse(ORIG);Object.keys(S).forEach(function(k){delete S[k];});Object.assign(S,o);editing=false;dirty=false;statusMsg='';render();}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function doc(){var json=JSON.stringify(S,null,1).replace(/</g,'\\u003c');
  return HEAD+'<title>'+esc(S.profile.name||'My')+' Portfolio</title><meta name="claude:viewport-fit-sides" content="cover">'+FONT+
    '<style id="css">'+document.getElementById('css').textContent+'</style><div id="root"></div><script type="application/json" id="state">'+json+
    '<\/script><script id="app">'+document.getElementById('app').textContent+'<\/script></body></html>';}
function save(){if(!art||saving)return;saving=true;S.updated=new Date().toISOString().slice(0,10);statusMsg='Saving…';updateBar();
  art.publish(doc()).then(function(){dirty=false;statusMsg='Saved. Reloading…';saving=false;updateBar();},function(e){saving=false;var c=e&&e.code;
    if(c==='conflict')statusMsg='A newer version was saved elsewhere. Loading it now.';
    else if(c==='not_writer'||c==='not_granted')statusMsg='You can view this page but not edit it.';
    else if(c==='consent_required')statusMsg='Allow saving when asked, then press Save again.';
    else statusMsg='Could not save ('+(c||'error')+'). Your edits are still here. Try Save again.';
    updateBar();});}
window.addEventListener('beforeunload',function(e){if(dirty&&!saving){e.preventDefault();e.returnValue='';}});

render();
function init(){if(!window.claude||!window.claude.use)return false;
  Promise.resolve(window.claude.use('artifact')).then(function(a){art=a;if(!a)return null;return window.claude.use('user');})
  .then(function(u){if(!art)return;return u&&u.canEdit?u.canEdit():true;})
  .then(function(ok){if(art&&ok){canEdit=true;updateBar();}}).catch(function(){});return true;}
if(!init())window.addEventListener('load',function(){init();});
})();
</script>
</body></html>
